name: Scheduler Tick

on:
  schedule:
    # 매시 0분 (UTC == KST 0분 — 빈도 동일). GitHub Actions schedule 은 부하 따라 ~5-10분 지연 가능.
    # private repo 무료 quota 2000분/월 안. workflow_dispatch 로 수동 trigger 도 가능.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduler-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install supabase-js (no full repo install)
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2

      - name: Run scheduler tick
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROUPWARE_BASE_URL: ${{ secrets.GROUPWARE_BASE_URL }}
          SCHEDULER_API_TOKEN: ${{ secrets.SCHEDULER_API_TOKEN }}
        run: node scripts/scheduler_tick.mjs
