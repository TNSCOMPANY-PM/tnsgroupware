name: Scheduler

on:
  schedule:
    # v5-10: schedule re-register 강제. GitHub Actions 가 schedule trigger 인식 못 한 상태였음 (#36 이후 Scheduled run 0회).
    # cron 매 5분 (시각 도래 후 최대 5분 대기). fetch-only run 시간 ~10s.
    # private repo 무료 quota 2000분/월 안 (일 288회 × ~10s = 일 48분 = 월 1440분).
    # workflow_dispatch 로 수동 trigger 도 가능.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduler-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # v5-09: fetch-only — supabase-js 의존 소멸. Node 22 유지 (안정).
          node-version: "22"

      - name: Run scheduler tick
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROUPWARE_BASE_URL: ${{ secrets.GROUPWARE_BASE_URL }}
          SCHEDULER_API_TOKEN: ${{ secrets.SCHEDULER_API_TOKEN }}
        run: node scripts/scheduler_tick.mjs
